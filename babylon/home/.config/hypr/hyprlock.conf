# Babylon lock screen. Left: the clock in Cinzel, the date on a gold rule, and
# the password on a gold line beside three incised crimson drums. Right: the
# saying in vertical columns (tategaki, read right to left) in Shippori Mincho
# B1, its katakana reading as a small gold column and the romaji turned 90°
# beside it, and one gate with a blade under it. No username.
# Sayings: ~/.config/hypr/babylon/sayings.txt (babylon-lock-saying).
# The marks and the gate are PNGs from ~/.config/hypr/babylon/build-art.py.
# A wrong password answers 雑種 (zasshu); change fail_text for the plain reason.
# Positions are for 1920x1080.

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
}

background {
    monitor =
    path = ~/.config/hypr/babylon/wallpaper.png
    color = rgb(0B0908)
    blur_passes = 3
    blur_size = 4
    brightness = 0.50
    vibrancy = 0
    noise = 0.01
}

# ---- left: clock, date, field ------------------------------------------

label {
    monitor =
    text = $TIME
    color = rgba(F0E7D2FF)
    font_size = 180
    font_family = Cinzel
    position = 186, 150
    halign = left
    valign = center
}

shape {
    monitor =
    size = 56, 1
    color = rgba(D4A72CFF)
    rounding = 0
    border_size = 0
    position = 198, 22
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='6000'>$(date +'%A · %-d %B' | tr '[:lower:]' '[:upper:]')</span>"
    color = rgba(D4A72CFF)
    font_size = 20
    font_family = Cinzel
    position = 272, 22
    halign = left
    valign = center
}

image {
    monitor =
    path = ~/.config/hypr/babylon/lock-marks.png
    size = 44
    rounding = 0
    border_size = 0
    position = 198, -96
    halign = left
    valign = center
    zindex = 0
}

input-field {
    monitor =
    size = 420, 50
    outline_thickness = 0
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    font_color = rgba(F0E7D2FF)
    font_family = JetBrainsMono Nerd Font
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    capslock_color = rgba(00000000)
    rounding = 0
    dots_size = 0.2
    dots_spacing = 0.6
    dots_center = false
    dots_rounding = 0
    fade_on_empty = false
    placeholder_text = <span foreground="##F4D675">▸</span>   <span foreground="##A99B80">password</span>
    fail_text = <span foreground="##EB4B50"><span font_family="Shippori Mincho B1" weight="800">雑種</span>   zasshu</span>
    check_text = <span foreground="##F4D675">verifying</span>
    zindex = 1
    position = 264, -96
    halign = left
    valign = center
}

# the gold line the password sits on
shape {
    monitor =
    size = 420, 1
    color = rgba(D4A72CFF)
    rounding = 0
    border_size = 0
    position = 264, -122
    halign = left
    valign = center
}

# ---- right: the saying, tategaki -----------------------------------------
# Column 1 is the rightmost; column 2 stands to its left; both start at the
# same height. The reading and the romaji run down beside them.

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/babylon-lock-saying jp1
    color = rgba(F0E7D2FF)
    font_size = 84
    font_family = Shippori Mincho B1 ExtraBold
    text_align = center
    position = -330, -120
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/babylon-lock-saying jp2
    color = rgba(F0E7D2FF)
    font_size = 84
    font_family = Shippori Mincho B1 ExtraBold
    text_align = center
    position = -450, -120
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/babylon-lock-saying reading
    color = rgba(F4D675FF)
    font_size = 24
    font_family = Shippori Mincho B1
    text_align = center
    position = -270, -132
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/babylon-lock-saying romaji
    color = rgba(A99B80FF)
    font_size = 15
    font_family = Cinzel
    rotate = 90
    position = -215, 110
    halign = right
    valign = center
}

# one gate, its blade pointing down, under the saying
image {
    monitor =
    path = ~/.config/hypr/babylon/lock-gate.png
    size = 70
    rounding = 0
    border_size = 0
    position = -345, 215
    halign = right
    valign = bottom
}

# ---- footer --------------------------------------------------------------

label {
    monitor =
    text = <span letter_spacing='4000'>BABYLON</span>
    color = rgba(7A6A4CFF)
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    position = 198, 40
    halign = left
    valign = bottom
}
