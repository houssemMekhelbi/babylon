# Babylon terminal. Night at 90% with compositor blur behind it;
# parchment text, the cursor in the attention colour.
# Both colour sections carry the same palette so a light/dark switch keybind
# cannot pull in foot's stock colours.

[main]
font=JetBrainsMono Nerd Font:size=10.5
line-height=20
pad=16x16
initial-color-theme=dark

[bell]
# A bell in a window without the focus marks it urgent, which the bar's workspace slot shows.
urgent=yes

[cursor]
style=block
blink=no
beam-thickness=2

[colors-dark]
alpha=0.90
blur=yes
background=0B0908
foreground=E8DFC9
cursor=0B0908 F4D675
regular0=0B0908
regular1=EB4B50
regular2=9DBB6A
regular3=D4A72C
regular4=7FA4E2
regular5=B48ACB
regular6=6CC0B5
regular7=A99B80
