bright1=F47C7F
bright2=B7D088
bright3=F4D675
bright4=A6C1EE
bright5=CFABE0
bright6=93D6CC
bright7=F0E7D2
selection-foreground=F0E7D2
selection-background=1E1810
jump-labels=0B0908 F4D675
scrollback-indicator=0B0908 D4A72C
search-box-no-match=0B0908 EB4B50
