# Babylon tmux. Status at the bottom on the terminal's own black with a
# hairline above it (the pane border). Session name in a deep-gold block
# ("王 name"); the current window is the one solid gold thing on the line,
# the rest are plain index:name in muted, activity marked in lapis; the clock
# muted on the right. Square blocks, no powerline slants.

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,alacritty*:RGB,xterm-ghostty:RGB,xterm-256color:RGB"
set -as terminal-features ",foot*:usstyle,alacritty*:usstyle,xterm-ghostty:usstyle"

# One status line in tmux's stock layout. Another theme (Nordschleife) runs two lines with its own
# status-format; a running server keeps those across a theme switch unless they are reset here.
set -g status on
set -gu status-format


set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=default,fg=#A99B80"

set -g status-left-length 40
set -g status-left "#[bg=#8E6B1F,fg=#F0E7D2,bold] 王 #{=/24/…:session_name} #[default]  "

set -g status-right-length 40
set -g status-right "#[fg=#A99B80]%d %b  %H:%M "

set -g window-status-separator " "
set -g window-status-format "#[fg=#A99B80] #I:#W#{?window_activity_flag,#[fg=#7FA4E2] •,} "
set -g window-status-current-format "#[bg=#D4A72C,fg=#0B0908,bold] #I:#W "
set -g window-status-activity-style "none"
set -g monitor-activity on
set -g visual-activity off

# Pane borders: active gold, inactive line.
set -g pane-border-lines single
set -g pane-border-style "fg=#3a2e1a"
set -g pane-active-border-style "fg=#d4a72c"
set -g pane-border-indicators off

set -g message-style "bg=#1E1810,fg=#F0E7D2"
set -g message-command-style "bg=#1E1810,fg=#F4D675"
set -g mode-style "bg=#D4A72C,fg=#0B0908"
set -g copy-mode-match-style "bg=#1E1810,fg=#7FA4E2,underscore"
set -g copy-mode-current-match-style "bg=#D4A72C,fg=#0B0908"
set -g menu-style "bg=#14100B,fg=#F0E7D2"
set -g menu-selected-style "bg=#D4A72C,fg=#0B0908"
set -g menu-border-style "fg=#D4A72C"
set -g menu-border-lines single
set -g popup-border-style "fg=#D4A72C"
set -g popup-border-lines single
set -g display-panes-colour "#3A2E1A"
set -g display-panes-active-colour "#F4D675"
set -g clock-mode-colour "#F4D675"
