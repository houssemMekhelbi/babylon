# Babylon launcher for fuzzel (unused: SUPER+D runs babylon-launcher, foot + fzf).

[main]
font=Alegreya Sans:size=10.5,IBM Plex Sans Arabic:size=10.5
use-bold=no
prompt="›  "
placeholder=search
icons-enabled=yes
match-counter=yes
anchor=center
lines=8
width=90
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=36
layer=overlay
terminal=foot -e

[colors]
background=14100BF7
text=A99B80FF
message=A99B80FF
prompt=F4D675FF
placeholder=7A6A4CFF
input=F0E7D2FF
match=D4A72CFF
selection=1E1810FF
selection-text=F0E7D2FF
selection-match=F4D675FF
counter=7FA4E2FF
border=D4A72CFF

[border]
width=1
radius=3
