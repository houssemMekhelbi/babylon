<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Babylon type:
       display    Cinzel               + Amiri (Arabic), Shippori Mincho B1 (Japanese): lock clock, banner names, bar time
       saying     Shippori Mincho B1   ExtraBold on the lock screen; Regular is the CJK fallback
       interface  Alegreya Sans        + IBM Plex Sans Arabic, Shippori Mincho B1
       data       JetBrainsMono Nerd Font (from the package) + IBM Plex Sans Arabic, Shippori Mincho B1
     <accept> puts the companion directly after the Latin face, so only glyphs
     the Latin face lacks use it. ▼ ▽ ▶ come from JetBrains Mono / DejaVu Sans Mono. -->
<fontconfig>
  <alias binding="same">
    <family>Alegreya Sans</family>
    <accept><family>IBM Plex Sans Arabic</family><family>Shippori Mincho B1</family></accept>
  </alias>
  <alias binding="same">
    <family>Cinzel</family>
    <accept><family>Amiri</family><family>Shippori Mincho B1</family></accept>
  </alias>
  <alias binding="same">
    <family>JetBrainsMono Nerd Font</family>
    <accept><family>IBM Plex Sans Arabic</family><family>Shippori Mincho B1</family></accept>
  </alias>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Alegreya Sans</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Cinzel</family>
      <family>Amiri</family>
      <family>Shippori Mincho B1</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>Shippori Mincho B1</family>
    </prefer>
  </alias>
</fontconfig>
